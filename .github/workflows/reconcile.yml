name: Reconcile generation and deletion jobs
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Reconcile pending jobs
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$APP_URL" && test -n "$CRON_SECRET"
          curl --fail --silent --show-error --max-time 300 -X POST "$APP_URL/api/internal/reconcile" -H "Authorization: Bearer $CRON_SECRET"
